<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JNN Site Plan Builder</title>
<meta name="description" content="Jim 'N Nick's catering site plan builder: drag-and-drop, to-scale event layouts on a satellite picture.">
<!-- JNN Site Plan Builder · one self-contained file · edit this file directly (no build step needed to run it) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#171512; --ink2:#1E1B17; --red:#F1312B; --cta:#C92922; --cta-h:#A71E18;
  --cream:#F4EFE0; --cream2:#F3ECDC; --warm:#C5C1B9; --tan:#615D54; --text:#2B2B2B;
  --teal:#0E7490; --blue:#2563EB; --gold:#C39849; --green:#2E7D32;
  --line:rgba(23,21,18,.14); --radius:12px; --shadow:0 2px 10px rgba(0,0,0,.18);
  --hit:44px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:Roboto,"Segoe UI",Arial,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
body{overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.oswald,h1,h2,h3,.btn,.eyebrow,.tab,.pill{font-family:Oswald,"Arial Narrow",Arial,sans-serif}
h1,h2,h3{margin:0;text-transform:uppercase;letter-spacing:.02em}
.eyebrow{color:var(--red);font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:13px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--hit);padding:0 16px;border-radius:10px;border:2px solid transparent;
  background:#fff;color:var(--ink);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.38;cursor:default;filter:none;transform:none}
.btn.cta{background:var(--cta);color:#fff}
.btn.cta:hover{background:var(--cta-h);filter:none}
.btn.dark{background:var(--ink);color:var(--cream);border-color:rgba(244,239,224,.25)}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.btn.outline{background:#fff;border-color:var(--ink)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn.icon{padding:0;width:var(--hit)}
.btn svg{width:22px;height:22px;flex:none}
.btn.on{background:var(--ink);color:var(--cream)}
.btn.danger{color:var(--cta);border-color:var(--cta);background:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

/* ---------- start screen ---------- */
#start{position:fixed;inset:0;overflow:auto;background:var(--cream)}
.band{background:var(--ink);color:var(--cream);position:relative;padding:28px 32px 26px 44px}
.band:before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--red)}
.band h1{font-size:44px;line-height:1.05;margin-top:6px;color:var(--cream)}
.band .who{position:absolute;right:24px;top:22px}
.big-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:26px 32px 8px}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:22px 22px 20px;border-radius:16px;border:none;cursor:pointer;text-align:left;
  background:var(--ink);color:var(--cream);box-shadow:var(--shadow);min-height:150px;touch-action:manipulation}
.big:hover{background:#26221d}
.big.cta{background:var(--cta)} .big.cta:hover{background:var(--cta-h)}
.big .t{font-family:Oswald,Arial;font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:.03em}
.big .d{font-size:15px;opacity:.9;line-height:1.35}
.big svg{width:40px;height:40px}
.folder-bar{margin:18px 32px 0;padding:14px 18px;border-radius:12px;background:#fff;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.folder-bar .ico{width:34px;height:34px;flex:none}
.folder-bar b{font-family:Oswald,Arial;text-transform:uppercase;letter-spacing:.04em}
.list-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:22px 32px 10px}
.list-head h2{font-size:22px;margin-right:auto}
.list-head input,.list-head select{height:44px;border-radius:10px;border:1.5px solid var(--warm);padding:0 12px;background:#fff;min-width:0}
.list-head input{width:240px}
#projList{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:6px 32px 40px}
.card{background:#fff;border-radius:var(--radius);box-shadow:0 2px 8px rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column}
.card .thumb{aspect-ratio:16/9;background:#d9d4c8 center/cover no-repeat;position:relative}
.card .thumb .status{position:absolute;left:10px;top:10px}
.card .body{padding:12px 14px 6px}
.card .name{font-family:Oswald,Arial;font-weight:700;font-size:20px;text-transform:uppercase;line-height:1.15}
.card .sub{color:var(--tan);font-size:14px;margin-top:2px}
.card .acts{display:flex;gap:8px;padding:10px 14px 14px;margin-top:auto}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--cream)}
.pill.Draft{background:#615D54}.pill.Sent{background:var(--blue)}.pill.Final{background:var(--green)}.pill.Archived{background:#9a958b}
.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--tan);border:2px dashed var(--warm);border-radius:14px;background:rgba(255,255,255,.5)}

/* ---------- editor ---------- */
#editor{position:fixed;inset:0;display:flex;flex-direction:column;background:#3a3631}
#topbar{background:var(--ink);color:var(--cream);display:flex;align-items:center;gap:8px;padding:6px 10px 6px 18px;position:relative;min-height:62px;flex-wrap:nowrap}
#topbar:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--red)}
#topbar .titles{min-width:0;display:flex;flex-direction:column;cursor:pointer;padding:2px 6px;border-radius:8px}
#topbar .titles:hover{background:rgba(255,255,255,.06)}
#topbar .titles .eyebrow{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .titles .ev{font-family:Oswald,Arial;font-weight:700;font-size:21px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw;line-height:1.1}
#planTabs{display:flex;gap:4px;align-items:center;overflow-x:auto;min-width:0;flex:1;padding:0 6px;scrollbar-width:thin}
.tab{border:none;background:transparent;color:var(--warm);font-size:15px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;min-height:40px;border-bottom:3px solid transparent}
.tab.active{color:var(--cream);border-bottom-color:var(--red);border-radius:8px 8px 0 0}
.tab:hover{background:rgba(255,255,255,.07)}
.tab .star{color:var(--gold);margin-right:4px}
#saveState{font-size:12.5px;color:var(--warm);white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis;text-align:right;line-height:1.2}
#saveState.warn{color:#ffb4a8}
.tb-group{display:flex;gap:6px;align-items:center}
#topbar .btn.dark{min-height:44px}
#work{flex:1;display:flex;min-height:0;position:relative}
#library{width:238px;background:var(--cream);overflow-y:auto;flex:none;border-right:1px solid var(--line);padding-bottom:30px;-webkit-overflow-scrolling:touch}
#library h3{font-size:13px;letter-spacing:.18em;color:var(--red);padding:14px 14px 6px;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 10px}
.tile{background:#fff;border:1.5px solid transparent;border-radius:10px;padding:6px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 1px 3px rgba(0,0,0,.1);min-height:92px}
.tile:hover{border-color:var(--ink)}
.tile.on{border-color:var(--cta);background:#fff4f2}
.tile svg{width:64px;height:52px;pointer-events:none}
.tile .n{font-family:Oswald,Arial;font-weight:600;font-size:13px;text-transform:uppercase;text-align:center;line-height:1.1;letter-spacing:.02em}
.tile .s{font-size:11px;color:var(--tan);line-height:1}
#stageWrap{flex:1;position:relative;overflow:hidden;background:#2f2c28;touch-action:none}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
#stage.panning{cursor:grabbing}
#stage.tool{cursor:crosshair}
#props{width:300px;background:#fff;overflow-y:auto;flex:none;border-left:1px solid var(--line);-webkit-overflow-scrolling:touch}
.ph{background:var(--ink);color:var(--cream);padding:12px 14px;font-family:Oswald,Arial;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:17px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:2}
.ph .x{margin-left:auto}
.psec{padding:12px 14px;border-bottom:1px solid var(--line)}
.psec h4{margin:0 0 8px;font-family:Oswald,Arial;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field>span{font-size:13px;color:var(--tan);font-weight:500}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=time],.field select,.field textarea{height:42px;border:1.5px solid var(--warm);border-radius:9px;padding:0 10px;background:#fff;width:100%}
.field textarea{height:76px;padding:8px 10px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--ink);outline-offset:0;border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.actgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.actgrid .btn{flex-direction:column;gap:2px;font-size:12.5px;min-height:58px;padding:4px 2px;background:var(--cream);border-color:transparent}
.actgrid .btn:hover{border-color:var(--ink)}
.actgrid .btn svg{width:22px;height:22px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--warm);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:none;background:#fff;min-height:40px;font-family:Oswald,Arial;font-weight:600;text-transform:uppercase;font-size:13.5px;letter-spacing:.04em;cursor:pointer;padding:0 6px}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--cream)}
.stat{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.stat b{font-family:Oswald,Arial;font-size:16px}
.note{font-size:13px;color:var(--tan);line-height:1.4}
.check{display:flex;gap:10px;align-items:center;min-height:38px;cursor:pointer;font-size:14.5px}
.check input{width:22px;height:22px;accent-color:var(--cta)}

/* floating controls on map */
.float{position:absolute;z-index:5}
#zoomCtl{left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
#zoomCtl .btn{background:#fff;box-shadow:var(--shadow)}
#mapInfo{right:12px;bottom:12px;background:rgba(23,21,18,.86);color:var(--cream);border-radius:10px;padding:6px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
#mapInfo .btn{min-height:32px;font-size:12.5px;padding:0 10px}
#toolHint{left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--cream);border-radius:12px;padding:8px 10px 8px 16px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:calc(100% - 24px);font-size:15px}
#toolHint .msg{line-height:1.3}
#undoFloat{display:none}
#addBtn{display:none}
.drag-ghost{position:fixed;z-index:100;pointer-events:none;opacity:.85;transform:translate(-50%,-50%)}
.drag-ghost svg{width:80px;height:64px}

/* context menu */
#ctxmenu{position:fixed;z-index:60;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.35);padding:6px;min-width:210px}
#ctxmenu button{display:flex;width:100%;align-items:center;gap:10px;border:none;background:none;padding:0 12px;min-height:42px;border-radius:8px;cursor:pointer;font-size:15px;text-align:left}
#ctxmenu button:hover{background:var(--cream)}
#ctxmenu button svg{width:20px;height:20px}
#ctxmenu hr{border:none;border-top:1px solid var(--line);margin:4px 0}
#ctxmenu .k{margin-left:auto;color:#9a958b;font-size:12px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,13,11,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.dlg.wide{width:min(1000px,100%)}
.dlg .dh{background:var(--ink);color:var(--cream);padding:16px 20px 14px 26px;position:relative}
.dlg .dh:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--red)}
.dlg .dh h2{font-size:24px}
.dlg .db{padding:18px 22px;overflow:auto;flex:1}
.dlg .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:#faf8f3}
.steps{display:flex;gap:6px;margin-top:8px}
.steps span{flex:1;height:5px;border-radius:3px;background:rgba(244,239,224,.25)}
.steps span.on{background:var(--red)}
.drop{border:3px dashed var(--warm);border-radius:14px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;background:var(--cream);cursor:pointer}
.drop.over{border-color:var(--cta);background:#fff1ee}
.drop img{max-width:100%;max-height:300px;border-radius:8px}
.calwrap{position:relative;background:#222;border-radius:10px;overflow:hidden;touch-action:none;height:min(52vh,460px)}
.calwrap svg{width:100%;height:100%;display:block}
.big-num{font-family:Oswald,Arial;font-size:30px;font-weight:700}
kbd{font-family:Roboto,Arial;font-size:12px;background:#eee;border-radius:4px;padding:1px 5px;border:1px solid #ccc}
table.pull{width:100%;border-collapse:collapse;font-size:14.5px}
table.pull th{background:var(--ink);color:var(--cream);font-family:Oswald,Arial;text-transform:uppercase;letter-spacing:.06em;font-weight:600;text-align:left;padding:8px 10px}
table.pull td{padding:7px 10px;border-bottom:1px solid var(--line)}
table.pull td.n{text-align:right;font-family:Oswald,Arial;font-weight:600;font-size:16px}
table.pull tr.tot td{background:#EEF5F1;font-weight:700}
.list-pick{display:flex;flex-direction:column;gap:8px}
.list-pick button{display:flex;gap:12px;align-items:center;text-align:left;padding:10px;border:1.5px solid var(--warm);border-radius:12px;background:#fff;cursor:pointer;min-height:60px}
.list-pick button:hover{border-color:var(--ink)}
.list-pick img{width:96px;height:54px;object-fit:cover;border-radius:6px;background:#ddd}

/* export screen */
#exportScreen{position:fixed;inset:0;z-index:40;background:#3a3631;display:flex;flex-direction:column}
#exportScreen .xbody{flex:1;display:flex;min-height:0}
#sheetWrap{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;min-width:0;overflow:auto;touch-action:none}
#sheetWrap svg{background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:100%;max-height:100%;height:auto}
#xopts{width:320px;background:#fff;overflow-y:auto;flex:none}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--cream);padding:12px 20px;border-radius:12px;box-shadow:var(--shadow);font-size:15px;max-width:calc(100% - 32px);text-align:center;transition:opacity .25s}
#toast.err{background:var(--cta)}
#busy{position:fixed;inset:0;z-index:95;background:rgba(15,13,11,.55);display:flex;align-items:center;justify-content:center;color:#fff;font-family:Oswald,Arial;font-size:22px;letter-spacing:.06em;text-transform:uppercase}

/* view-only mode */
.viewonly #library,.viewonly .edit-only{display:none!important}

/* ---------- narrow / iPad ---------- */
@media (max-width:1300px){
  #pullBtn .tb-label,#redoBtn .tb-label{display:none}
  #saveState{max-width:110px;font-size:11.5px}
}
@media (max-width:1100px){
  #library{width:200px}
  #props{width:270px}
  .tile svg{width:56px;height:44px}
  #topbar .titles .ev{max-width:24vw}
}
@media (max-width:900px){
  .big-actions{grid-template-columns:1fr;padding:18px 16px 4px}
  .big{min-height:0;flex-direction:row;align-items:center;gap:16px}
  .big .d{display:none}
  .band{padding:20px 16px 18px 28px}.band h1{font-size:32px}
  .band .who{position:static;margin-top:10px}
  .folder-bar,.list-head{margin-left:16px;margin-right:16px;padding-left:12px;padding-right:12px}
  .list-head{padding:18px 16px 8px;margin:0}
  .list-head input{width:100%}
  #projList{padding:6px 16px 40px}
  #library{position:absolute;left:0;top:0;bottom:0;z-index:20;width:250px;box-shadow:6px 0 24px rgba(0,0,0,.35);transform:translateX(-105%);transition:transform .2s}
  #library.open{transform:none}
  #addBtn{display:inline-flex}
  #props{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:40%;z-index:15;border-left:none;border-top:3px solid var(--ink);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.3)}
  #props.collapsed{max-height:58px;overflow:hidden}
  #topbar .titles .ev{max-width:30vw;font-size:18px}
  #planTabs{display:none}
  #planSelect{display:inline-block!important}
  #saveState{display:none}
  .tb-label{display:none}
  #zoomCtl{bottom:auto;top:12px}
  #mapInfo{bottom:auto;top:12px}
  #xopts{position:absolute;right:0;top:0;bottom:0;width:min(320px,85%);box-shadow:-6px 0 24px rgba(0,0,0,.35)}
  #exportScreen .xbody{position:relative}
  #xoptsToggle{display:inline-flex!important}
  #xopts.closed{display:none}
}
@media (min-width:901px){.narrow-only{display:none}}
#planSelect{display:none;height:40px;border-radius:8px;background:#2a2621;color:var(--cream);border:1px solid rgba(244,239,224,.3);padding:0 8px;max-width:30vw}
#xoptsToggle{display:none}
@media print{
  body{background:#fff;overflow:visible}
  #app,#toast,#busy{display:none!important}
  #printArea{display:block!important}
  #printArea svg{width:100%;height:auto}
}
#printArea{display:none}

</style>
</head>
<body>
<div id="app">
  <!-- ================= START SCREEN ================= -->
  <section id="start">
    <div class="band">
      <div class="eyebrow">Jim 'N Nick's Bar-B-Q · Catering</div>
      <h1>Site Plan Builder</h1>
      <div class="who"><button class="btn dark small" id="whoBtn" title="Change the name that shows on 'Last saved by'"><i data-icon="user"></i><span id="whoName">Set your name</span></button></div>
    </div>
    <div class="big-actions">
      <button class="big cta" id="bNew" title="Start a new site plan from a satellite picture"><i data-icon="plus"></i><span class="t">New Plan</span><span class="d">Drop in a satellite picture, set the scale, and start placing equipment.</span></button>
      <button class="big" id="bOpen" title="Open a plan you already started"><i data-icon="folder"></i><span class="t">Open Plan</span><span class="d">Pick up where you left off. Plans live in the shared Plans folder.</span></button>
      <button class="big" id="bDup" title="Copy an old plan to use for a new event"><i data-icon="copy"></i><span class="t">Duplicate a Plan</span><span class="d">Reuse a venue you've done before. Copy it, rename it, change what's different.</span></button>
    </div>
    <div class="folder-bar" id="folderBar"></div>
    <div class="list-head">
      <h2>Plans</h2>
      <input type="search" id="search" placeholder="Search event or venue" title="Type to filter the list">
      <select id="sort" title="Change the order of the list">
        <option value="edited">Last edited</option>
        <option value="date">Event date</option>
        <option value="name">Name (A–Z)</option>
      </select>
      <select id="statusFilter" title="Show only plans with this status">
        <option value="">All status</option>
        <option>Draft</option><option>Sent</option><option>Final</option><option>Archived</option>
      </select>
    </div>
    <div id="projList"></div>
  </section>

  <!-- ================= EDITOR ================= -->
  <section id="editor" class="hidden">
    <header id="topbar">
      <button class="btn dark icon" id="homeBtn" title="Back to the start screen (your work is saved)"><i data-icon="home"></i></button>

<script>
'use strict';
/* =====================================================================
   JNN SITE PLAN BUILDER — core: utilities, icons, palette, catalog,
   geometry, app state, undo/redo
   ===================================================================== */
const APP_VERSION = '1.0.0';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const f3 = v => Math.round(v * 1000) / 1000;
const uid = (p = 'o') => p + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const deep = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function debounce(fn, ms) { let t; const d = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; d.flush = (...a) => { clearTimeout(t); fn(...a); }; d.cancel = () => clearTimeout(t); return d; }
function fmtFt(v, dp = 1) { if (v == null || isNaN(v)) return '—'; const r = Math.round(v * 10 ** dp) / 10 ** dp; return (Number.isInteger(r) ? r.toString() : r.toFixed(dp)).replace(/\.0$/, ''); }
function fmtNum(v) { return (Math.round(v) || 0).toLocaleString('en-US'); }
function fmtTime(ts) { if (!ts) return ''; const d = new Date(ts); const now = new Date(); const t = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); if (d.toDateString() === now.toDateString()) return t; return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + t; }
function fmtDate(s) { if (!s) return ''; const d = new Date(s + 'T12:00:00'); if (isNaN(d)) return s; return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
function safeName(s) { return String(s || 'Untitled').replace(/[\\/:*?"<>|#%]+/g, '').replace(/\s+/g, ' ').trim().slice(0, 80) || 'Untitled'; }

/* ---------- SVG string helpers (units = feet) ---------- */
const AMAP = { cls: 'class', sw: 'stroke-width', da: 'stroke-dasharray', op: 'opacity', fo: 'fill-opacity', lj: 'stroke-linejoin', lc: 'stroke-linecap', ta: 'text-anchor', fs: 'font-size', fw: 'font-weight', ff: 'font-family', ls: 'letter-spacing', db: 'dominant-baseline', tf: 'transform', ve: 'vector-effect', pe: 'pointer-events', ml: 'stroke-miterlimit' };
function A(at) { let s = ''; for (const k in at) { const v = at[k]; if (v == null || v === false) continue; s += ` ${AMAP[k] || k}="${typeof v === 'number' ? f3(v) : v}"`; } return s; }
const R = (x, y, w, h, at = {}) => `<rect x="${f3(x)}" y="${f3(y)}" width="${f3(Math.max(0, w))}" height="${f3(Math.max(0, h))}"${A(at)}/>`;
const Ci = (x, y, r, at = {}) => `<circle cx="${f3(x)}" cy="${f3(y)}" r="${f3(r)}"${A(at)}/>`;
const Pa = (d, at = {}) => `<path d="${d}"${A(at)}/>`;
const Li = (x1, y1, x2, y2, at = {}) => `<line x1="${f3(x1)}" y1="${f3(y1)}" x2="${f3(x2)}" y2="${f3(y2)}"${A(at)}/>`;
const FONT_H = "Oswald,'Arial Narrow',Arial,sans-serif";
const FONT_B = "Roboto,Arial,sans-serif";
function Tx(x, y, txt, at = {}) { return `<text x="${f3(x)}" y="${f3(y)}"${A(Object.assign({ ff: FONT_H, fw: 700, ta: 'middle', db: 'central' }, at))}>${esc(txt)}</text>`; }

/* text measuring (Oswald) */
const _mc = document.createElement('canvas').getContext('2d');
function textW(str, size, weight = 600, family = 'Oswald', ls = 0) {
  _mc.font = `${weight} 100px ${family}, 'Arial Narrow', Arial`;
  const w = _mc.measureText(String(str)).width / 100 * size;
  return w + ls * size * Math.max(0, String(str).length - 1);
}

/* ---------- palette ---------- */
const C = { ink: '#171512', ink2: '#1E1B17', red: '#F1312B', cta: '#C92922', cream: '#F4EFE0', warm: '#C5C1B9', tan: '#615D54', text: '#2B2B2B', teal: '#0E7490', blue: '#2563EB', gold: '#C39849', green: '#2E7D32' };
const FLOW_COLORS = [['Red', '#F1312B'], ['Blue', '#2563EB'], ['Gold', '#C39849'], ['Green', '#16A34A'], ['Teal', '#0E7490'], ['Purple', '#7C3AED'], ['Orange', '#EA7A17'], ['Black', '#171512']];
const PILL_COLORS = { dark: [C.ink, C.cream], red: [C.cta, '#fff'], blue: [C.blue, '#fff'], gold: [C.gold, C.ink], teal: [C.teal, '#fff'], white: ['#ffffff', C.ink] };
const BOX_FILLS = { cream: ['#F4EFE0', C.ink], white: ['#ffffff', C.ink], dark: [C.ink2, C.cream], red: [C.cta, '#fff'], teal: [C.teal, '#fff'], gold: [C.gold, C.ink], clear: ['none', '#ffffff'] };

/* ---------- icons ---------- */
const IC = {
  plus: 'M12 5v14M5 12h14', folder: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z', copy: 'M9 9h10v10H9zM5 15V5h10',
  home: 'M4 11l8-7 8 7M6 10v9h4v-5h4v5h4v-9', undo: 'M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-3', redo: 'M15 7l5 5-5 5M20 12H9a5 5 0 0 0 0 10h3',
  list: 'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01', pdf: 'M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6', zin: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5M11 8v6M8 11h6',
  zout: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5M8 11h6', fit: 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5', back: 'M15 5l-7 7 7 7',
  gear: 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1',
  user: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0', turn: 'M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5', trash: 'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',
  lock: 'M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3', unlock: 'M6 11h12v9H6zM8 11V8a4 4 0 0 1 7.5-2', eye: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
  eyeoff: 'M3 3l18 18M10.6 6.1A10 10 0 0 1 12 6c6 0 10 6 10 6a17 17 0 0 1-3.2 3.8M6.6 6.6C3.8 8.4 2 12 2 12s4 7 10 7a9.6 9.6 0 0 0 5.4-1.6',
  front: 'M8 8h12v12H8zM4 4h12v4M4 4v12h4', backz: 'M4 4h12v12H4zM8 16v4h12V8h-4', tag: 'M3 12V4h8l10 10-8 8z M7.5 7.5h.01', hash: 'M5 9h14M5 15h14M10 3L8 21M16 3l-2 18',
  flow: 'M3 17c4-8 8 2 12-6M15 11l4-4M19 7v5M19 7h-5', rope: 'M3 12h18M3 9v6M21 9v6M12 9v6', ruler: 'M3 17L17 3l4 4L7 21zM7 13l2 2M10 10l2 2M13 7l2 2',
  scale: 'M3 12h18M3 8v8M21 8v8M8 10v4M16 10v4', grid: 'M3 3h18v18H3zM9 3v18M15 3v18M3 9h18M3 15h18', check: 'M4 12l5 5 11-11', x: 'M5 5l14 14M19 5L5 19',
  img: 'M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6M15 9h.01', alignL: 'M4 3v18M8 7h12M8 12h8M8 17h10', alignC: 'M12 3v18M6 7h12M8 12h8M5 17h14', alignR: 'M20 3v18M4 7h12M8 12h8M6 17h10',
  alignT: 'M3 4h18M7 8v12M12 8v8M17 8v10', alignM: 'M3 12h18M7 6v12M12 8v8M17 5v14', alignB: 'M3 20h18M7 4v12M12 8v8M17 6v10', spaceH: 'M4 4v16M20 4v16M9 8h6v8H9z', spaceV: 'M4 4h16M4 20h16M8 9h8v6H8z',
  seat: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M2 12h2M20 12h2', history: 'M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2', download: 'M12 4v12M7 11l5 5 5-5M4 20h16',
  print: 'M6 9V3h12v6M6 18H4v-7h16v7h-2M7 14h10v7H7z', star: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z', note: 'M5 4h14v12l-4 4H5zM15 20v-4h4', pin: 'M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11zM12 8a2 2 0 1 0 0 4 2 2 0 0 0 0-4z',
  dup: 'M8 8h12v12H8zM4 16V4h12', menu: 'M4 6h16M4 12h16M4 18h16', more: 'M5 12h.01M12 12h.01M19 12h.01', north: 'M12 3l6 18-6-4-6 4z'
};
function icon(name, extra = '') { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}><path d="${IC[name] || ''}"/></svg>`; }
function hydrateIcons(root = document) { $$('i[data-icon]', root).forEach(i => { i.outerHTML = icon(i.dataset.icon); }); }

/* =====================================================================
   OBJECT CATALOG  (all sizes in feet; local frame centered; -y = front)
   ===================================================================== */
const SHD = 'rgba(0,0,0,.38)';
const shadowRect = (x, y, w, h, rx = 0) => R(x + .35, y + .45, w, h, { rx, fill: SHD, cls: 'shd' });
function hitchTongue(W, y0, dy) { return Pa(`M${f3(-W * .3)} ${f3(dy + .2)} L0 ${f3(y0 + .7)} L${f3(W * .3)} ${f3(dy + .2)}`, { fill: 'none', stroke: C.ink, sw: .5, lj: 'round' }) + Ci(0, y0 + .55, .5, { fill: C.ink, stroke: '#555', sw: .12 }); }
function wheels(W, ys, len = 2.3) { let s = ''; for (const y of ys) s += R(-W / 2 - .45, y, .6, len, { fill: '#0f0e0d', rx: .15 }) + R(W / 2 - .15, y, .6, len, { fill: '#0f0e0d', rx: .15 }); return s; }

const CAT = {};
function def(key, d) { d.key = key; CAT[key] = Object.assign({ resize: 'none', obstacle: true, chairs: 0, labelPos: 'above' }, d); }

def('smoker', {
  name: 'Smoker rig', short: 'The Man in Black', group: 'food', w: 8, h: 24, legend: 'Smoker rig', sizeTxt: o => `${fmtFt(o.w)} × ${fmtFt(o.h - 4)} ft deck + hitch`, defLabel: 'SMOKER RIG', labelPos: 'below',
  draw(o) {
    const W = o.w, H = o.h, t = Math.min(4, H * .2), x0 = -W / 2, y0 = -H / 2, dy = y0 + t, D = H - t;
    let s = shadowRect(x0, dy, W, D, .5) + hitchTongue(W, y0, dy) + wheels(W, [dy + D * .56, dy + D * .56 + 2.7]);
    s += R(x0, dy, W, D, { rx: .5, fill: '#262422', stroke: C.ink, sw: .25 });
    s += R(x0 + .7, dy + .7, W - 1.4, D * .3, { rx: .35, fill: '#3b3834', stroke: '#0c0b0a', sw: .2 });
    s += R(-W * .2, dy + 1.3, W * .4, W * .34, { rx: .25, fill: '#dcd8d0', cls: 'dt' }) + Ci(W * .07, dy + 1.3 + W * .17, .38, { fill: C.ink, cls: 'dt' });
    const gy = dy + D * .36, gh = D * .57;
    s += R(x0 + 1.4, gy, W - 2.8, gh, { fill: '#4b4844', stroke: '#111', sw: .15 });
    let g = ''; for (let y = gy + .8; y < gy + gh - .3; y += .85) g += Li(x0 + 1.6, y, W / 2 - 1.6, y, { stroke: '#8d8981', sw: .14 });
    s += `<g class="dt">${g}</g>`;
    s += R(x0 + .45, gy, .42, gh, { fill: C.red }) + R(W / 2 - .87, gy, .42, gh, { fill: C.red });
    return s;
  }
});
def('reefer', {
  name: 'Reefer trailer', group: 'food', w: 8, h: 16, legend: 'Reefer trailer', sizeTxt: o => `${fmtFt(o.w)} × ${fmtFt(o.h - 4)} ft + hitch`,
  draw(o) {
    const W = o.w, H = o.h, t = Math.min(4, H * .25), x0 = -W / 2, y0 = -H / 2, dy = y0 + t, D = H - t;
    let s = shadowRect(x0, dy, W, D, .3) + hitchTongue(W, y0, dy) + wheels(W, [dy + D - 4.6]);
    s += R(x0, dy, W, D, { rx: .3, fill: '#f8f8f5', stroke: C.ink, sw: .25 });
    let r = ''; for (let y = dy + 3; y < dy + D - .4; y += 1.5) r += Li(x0 + .9, y, W / 2 - .9, y, { stroke: '#d5d2cb', sw: .12 });
    s += `<g class="dt">${r}</g>`;
    s += R(x0 + .8, dy + .35, W - 1.6, 1.9, { rx: .25, fill: '#8f989d', stroke: '#4b5257', sw: .15 }) + Ci(W * .18, dy + 1.3, .38, { fill: '#3b4246', cls: 'dt' });
    s += R(x0 + .32, dy + 2.6, .38, D - 3.2, { fill: C.teal }) + R(W / 2 - .7, dy + 2.6, .38, D - 3.2, { fill: C.teal });
    return s;
  }
});
def('van', {
  name: 'Cargo van', short: 'U-Haul / Transit', group: 'food', w: 7, h: 18.5, legend: 'Cargo van', sizeTxt: o => `${fmtFt(o.w)} × ${fmtFt(o.h)} ft`, numbered: true,
  draw(o) {
    const W = o.w, H = o.h, x0 = -W / 2, y0 = -H / 2;
    let s = shadowRect(x0, y0, W, H, 1.3);
    s += R(x0 - .55, y0 + 3.5, .6, 1, { fill: C.ink, rx: .15 }) + R(W / 2 - .05, y0 + 3.5, .6, 1, { fill: C.ink, rx: .15 });
    s += R(x0, y0, W, H, { rx: 1.3, fill: '#fbfbf9', stroke: C.ink, sw: .25 });
    s += Pa(`M${f3(x0 + .55)} ${f3(y0 + 3.4)} Q0 ${f3(y0 + .6)} ${f3(-x0 - .55)} ${f3(y0 + 3.4)} L${f3(-x0 - .8)} ${f3(y0 + 4.5)} L${f3(x0 + .8)} ${f3(y0 + 4.5)}Z`, { fill: '#1d1c1a' });
    let r = ''; for (let y = y0 + 6; y < y0 + H - .8; y += 1.6) r += Li(x0 + .95, y, W / 2 - .95, y, { stroke: '#d8d5ce', sw: .12 });
    s += `<g class="dt">${r}</g>`;
    s += R(x0 + .28, y0 + 4.9, .45, H - 5.7, { fill: C.red }) + R(W / 2 - .73, y0 + 4.9, .45, H - 5.7, { fill: C.red });
    if (o.num) s += Ci(0, 1.2, 1.6, { fill: C.cta, stroke: C.ink, sw: .22 }) + Tx(0, 1.25, o.num, { fs: 2.1, fill: '#fff' });
    return s;
  }
});
function tentDraw(o, prize) {
  const W = o.w, H = o.h, x0 = -W / 2, y0 = -H / 2;
  let s = shadowRect(x0, y0, W, H);
  s += R(x0, y0, W, H, { fill: '#ffffff', stroke: C.ink, sw: .2 });
  let r = '';
  if (W >= H) { const a = W / 2 - H / 2; r += Pa(`M${f3(x0)} ${f3(y0)}L${f3(-a)} 0L${f3(x0)} ${f3(-y0)}M${f3(-x0)} ${f3(y0)}L${f3(a)} 0L${f3(-x0)} ${f3(-y0)}M${f3(-a)} 0L${f3(a)} 0`, { fill: 'none', stroke: '#b9b4aa', sw: .16 }); }
  else { const a = H / 2 - W / 2; r += Pa(`M${f3(x0)} ${f3(y0)}L0 ${f3(-a)}L${f3(-x0)} ${f3(y0)}M${f3(x0)} ${f3(-y0)}L0 ${f3(a)}L${f3(-x0)} ${f3(-y0)}M0 ${f3(-a)}L0 ${f3(a)}`, { fill: 'none', stroke: '#b9b4aa', sw: .16 }); }
  s += `<g class="dt">${r}</g>`;
  if (prize) { const tw = Math.min(W * .74, 16), th = Math.min(2.6, H * .3); s += R(-tw / 2, H * .12 - th / 2, tw, th, { fill: '#8B5A2B', stroke: '#4a2e12', sw: .15 }); }
  if (W >= H) s += R(x0, y0, W, .5, { fill: C.red }) + R(x0, -y0 - .5, W, .5, { fill: C.red });
  else s += R(x0, y0, .5, H, { fill: C.red }) + R(-x0 - .5, y0, .5, H, { fill: C.red });
  const L = .6; let legs = '';
  const pts = [[x0, y0], [-x0, y0], [x0, -y0], [-x0, -y0]]; if (W >= 18) pts.push([0, y0], [0, -y0]); if (H >= 18) pts.push([x0, 0], [-x0, 0]);
  for (const [x, y] of pts) legs += R(x - L / 2, y - L / 2, L, L, { fill: C.ink });
  return s + legs;
}
def('tent20', { name: 'Tent 20×10', group: 'tents', w: 20, h: 10, legend: 'Tents', sizeTxt: o => `${fmtFt(Math.max(o.w, o.h))} × ${fmtFt(Math.min(o.w, o.h))} ft`, draw: o => tentDraw(o) });
def('tent10', { name: 'Tent 10×10', group: 'tents', w: 10, h: 10, legend: 'Tents', sizeTxt: o => `${fmtFt(o.w)} × ${fmtFt(o.h)} ft`, draw: o => tentDraw(o) });
def('prize', { name: 'Prize tent', group: 'event', w: 20, h: 13, legend: 'Prize tent', sizeTxt: o => `${fmtFt(o.w)} × ${fmtFt(o.h)} ft`, defLabel: 'PRIZE TENT', resize: 'free', draw: o => tentDraw(o, true) });
def('grill', {
  name: 'Pop-up grill', group: 'food', w: 4, h: 2.5, legend: 'Pop-up grills', sizeTxt: () => '4 × 2½ ft',

/* =====================================================================
   GEOMETRY
   ===================================================================== */
const D2R = Math.PI / 180;
function rot(x, y, deg) { const a = deg * D2R, c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; }
function toWorld(o, lx, ly) { const [x, y] = rot(lx, ly, o.r || 0); return [o.x + x, o.y + y]; }
function toLocal(o, wx, wy) { return rot(wx - o.x, wy - o.y, -(o.r || 0)); }
function extent(o) { const d = CAT[o.type]; if (d && d.extent) return d.extent(o); return { x0: -o.w / 2, y0: -o.h / 2, x1: o.w / 2, y1: o.h / 2 }; }
function corners(o) { const e = extent(o); return [[e.x0, e.y0], [e.x1, e.y0], [e.x1, e.y1], [e.x0, e.y1]].map(([x, y]) => toWorld(o, x, y)); }
function aabb(o) { const c = corners(o); const xs = c.map(p => p[0]), ys = c.map(p => p[1]); return { x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs), y1: Math.max(...ys) }; }
function distSeg(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy; let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; t = clamp(t, 0, 1); const x = ax + t * dx, y = ay + t * dy; return Math.hypot(px - x, py - y); }
function polyLen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; }
function circleHitsObj(cx, cy, r, o) {
  const d = CAT[o.type];
  if (d && d.round) { const rr = (o.type === 'tree' ? o.w / 2 : (d.fp || o.w / 2)); return Math.hypot(cx - o.x, cy - o.y) < r + rr; }
  const [lx, ly] = toLocal(o, cx, cy); const e = extent(o);
  const qx = clamp(lx, e.x0, e.x1), qy = clamp(ly, e.y0, e.y1); return Math.hypot(lx - qx, ly - qy) < r;
}
function ptInObj(o, wx, wy, pad = 0) { const [lx, ly] = toLocal(o, wx, wy); const e = extent(o); return lx >= e.x0 - pad && lx <= e.x1 + pad && ly >= e.y0 - pad && ly <= e.y1 + pad; }
function offsetPolyline(pts, d) {
  if (!d || pts.length < 2) return pts.map(p => p.slice());
  const n = pts.length, segs = [];
  for (let i = 0; i < n - 1; i++) { const [ax, ay] = pts[i], [bx, by] = pts[i + 1]; const L = Math.hypot(bx - ax, by - ay) || 1; const nx = -(by - ay) / L * d, ny = (bx - ax) / L * d; segs.push([[ax + nx, ay + ny], [bx + nx, by + ny]]); }
  const out = [segs[0][0]];
  for (let i = 1; i < segs.length; i++) {
    const [p1, p2] = segs[i - 1], [p3, p4] = segs[i];
    const den = (p1[0] - p2[0]) * (p3[1] - p4[1]) - (p1[1] - p2[1]) * (p3[0] - p4[0]);
    if (Math.abs(den) < 1e-9) { out.push(p2); continue; }
    const t = ((p1[0] - p3[0]) * (p3[1] - p4[1]) - (p1[1] - p3[1]) * (p3[0] - p4[0])) / den;
    out.push([p1[0] + t * (p2[0] - p1[0]), p1[1] + t * (p2[1] - p1[1])]);
  }
  out.push(segs[segs.length - 1][1]);
  return out;
}

/* =====================================================================
   UNDO / REDO  (snapshots exclude the big background image + history)
   ===================================================================== */
const U = { stack: [], redo: [], cur: null, max: 120 };
function snapshot() {
  return JSON.stringify({ project: S.P.project, planId: S.planId, plans: S.P.plans.map(p => Object.assign({}, p, { history: undefined })), bg: { pxPerFt: S.P.background.pxPerFt, calib: S.P.background.calib } });
}
function resetUndo() { U.stack = []; U.redo = []; U.cur = S.P ? snapshot() : null; updateUndoBtns(); }
function commit(opts = {}) {
  if (!S.P || S.readOnly) return;
  const s = snapshot();
  if (s === U.cur) return;
  if (U.cur) U.stack.push(U.cur);
  if (U.stack.length > U.max) U.stack.shift();
  U.cur = s; U.redo = [];
  updateUndoBtns();
  if (!opts.noSave) markDirty();
}
function restoreSnap(s) {
  const d = JSON.parse(s);
  const hist = {}; S.P.plans.forEach(p => hist[p.id] = p.history || []);
  S.P.project = d.project; S.P.plans = d.plans.map(p => Object.assign(p, { history: hist[p.id] || [] }));
  S.P.background.pxPerFt = d.bg.pxPerFt; S.P.background.calib = d.bg.calib;
  if (S.P.plans.some(p => p.id === d.planId)) S.planId = d.planId;
  const valid = new Set(); plan().objects.forEach(o => valid.add(o.id)); plan().lines.forEach(l => valid.add(l.id));
  S.sel = new Set([...S.sel].filter(id => valid.has(id)));
}
function undo() { if (!U.stack.length || S.readOnly) return; U.redo.push(U.cur); U.cur = U.stack.pop(); restoreSnap(U.cur); afterHistory(); }
function redo() { if (!U.redo.length || S.readOnly) return; U.stack.push(U.cur); U.cur = U.redo.pop(); restoreSnap(U.cur); afterHistory(); }
function afterHistory() { updateUndoBtns(); refreshAll(); markDirty(); }
function updateUndoBtns() { const u = $('#undoBtn'), r = $('#redoBtn'); if (u) u.disabled = !U.stack.length; if (r) r.disabled = !U.redo.length; }

/* =====================================================================
   PRODUCTION BUILDER, SEATING FILL, FLOW & ROPE LINES (geometry + markup)
   ===================================================================== */
function defaultProd() { return { boxes: '', windowMin: 70, rate: 250, lines: 5, auto: false, gap: 4, aisle: 2, side: 3, legW: 2.5, legTables: 2, tableLen: 8, pickupLen: 8, extMid: true }; }
function prodNeeded(p) {
  const boxes = +p.boxes || 0, hrs = (+p.windowMin || 0) / 60, rate = +p.rate || 250;
  if (!boxes || !hrs) return null;
  return { perLine: rate * hrs, lines: Math.max(1, Math.ceil(boxes / (rate * hrs))) };
}
function prodLayout(p) {
  const n = clamp(Math.round(+p.lines || 1), 1, 30), legW = +p.legW || 2.5, gap = +p.gap >= 0 ? +p.gap : 4, aisle = +p.aisle >= 0 ? +p.aisle : 2;
  const tl = +p.tableLen || 8, lt = clamp(Math.round(+p.legTables || 2), 1, 4), legLen = tl * lt, pl = +p.pickupLen || 8, side = +p.side >= 0 ? +p.side : 3;
  const ext = !!p.extMid && n % 2 === 1 && n >= 3;
  const legSpan = n * legW + (n - 1) * gap;
  const frontW = ext ? (n - 1) * pl + legW : n * pl;
  const W = Math.max(legSpan + 2 * side, frontW), D = aisle + legLen + legW;
  const top = -D / 2, legTop = top + aisle, legBot = legTop + legLen;
  const legs = []; for (let i = 0; i < n; i++) { const x = -legSpan / 2 + i * (legW + gap); legs.push({ x, y: legTop, w: legW, h: legLen, tables: lt }); }
  const pickups = [];
  if (ext) {
    const mid = (n - 1) / 2; let x = -frontW / 2;

/* ---------------- keyboard ---------------- */
function onKey(e) {
  if ($('#editor').classList.contains('hidden') || !$('#exportScreen').classList.contains('hidden') || !$('#modal').classList.contains('hidden')) { if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) closeModal(); return; }
  const tg = e.target; if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT' || tg.isContentEditable)) { if (e.key === 'Escape') tg.blur(); return; }
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'c') { e.preventDefault(); copySel(); return; }
  if (mod && k === 'v') { e.preventDefault(); pasteClip(); return; }
  if (mod && k === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (mod && k === 'a') { e.preventDefault(); selectAll(); return; }
  if (mod && k === 's') { e.preventDefault(); saveNow(true); return; }
  if (mod) return;
  if (e.key === 'Escape') { if (S.tool) cancelTool(); else { S.sel.clear(); renderSel(); renderProps(); } hideCtx(); return; }
  if (e.key === 'Enter' && S.tool) { finishTool(); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace')) { e.preventDefault(); if (S.tool && S.tool.pts && S.tool.pts.length) toolBack(); else removeSel(); return; }
  if (k === 'r' && S.sel.size) { turnSel(e.shiftKey ? -90 : 90); return; }
  const step = e.shiftKey ? 5 : 1;
  const arrows = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
  if (arrows[e.key] && S.sel.size) { e.preventDefault(); nudgeSel(...arrows[e.key]); return; }
  if (k === '+' || k === '=') zoomAt(1.25); if (k === '-') zoomAt(.8);
}

const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const GFONTS_CSS = 'https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap';

/* ---------------- pull list ---------------- */
function pullCounts(p) {
  const rows = new Map(); const add = (item, size, qty, unit = '') => { const k = item + '|' + size; const r = rows.get(k) || { item, size, qty: 0, unit }; r.qty += qty; rows.set(k, r); };
  let chairs = 0, prodTables = 0;
  for (const o of p.objects) {
    if (o.hidden) continue; const d = CAT[o.type]; if (!d) continue;
    if (o.type === 'production') { const L = prodLayout(o.p); prodTables += L.tables; add('Production block', `${fmtFt(L.W, 0)} × ${fmtFt(L.D, 0)} ft, ${L.n} lines`, 1); continue; }
    if (o.type === 'seating') { const c = seatingCounts(o); const T = CAT[c.type]; if (c.tables) add(T.name.replace(/ \+.*$/, '') + (c.type === 'hightop' ? '' : ' tables'), T.sizeTxt(), c.tables); chairs += c.seats; continue; }
    if (d.noPull) continue;
    const nm = o.type === 'round60' || o.type === 'round48' ? d.name.replace(/ \+.*$/, '') + ' tables' : d.name;
    add(nm, d.sizeTxt(o), 1); chairs += d.chairs || 0;
    if (o.type === 'prize') add('8-ft tables (prize tent)', '8 ft × 30 in', 1);
  }
  if (prodTables) add('8-ft tables (production)', '8 ft × 30 in', prodTables);
  let rope = 0, posts = 0; for (const l of p.lines) if (l.kind === 'rope' && !l.hidden) { const s = ropeStats(l); rope += s.length; posts += s.posts; }
  const list = [...rows.values()];
  if (chairs) list.push({ item: 'Chairs', size: 'for round tables', qty: chairs });
  if (rope) { list.push({ item: 'Rope / belt barrier', size: 'total length', qty: Math.ceil(rope), unit: 'ft' }); list.push({ item: 'Rope posts', size: `about ${fmtFt(rope / Math.max(1, posts - 1), 0)} ft apart`, qty: posts }); }
  const t8 = list.filter(r => /8-ft|Banquet/.test(r.item)).reduce((s, r) => s + r.qty, 0);

  if (!d.background.calib && d.background.image) toast('Scale not set yet. Click “Set scale” at the bottom right when you can.', false, 5000);
  if (HAS_FS) { if (!(S.dir && S.dirOk)) { await sleep(300); modal(`<div class="dh"><div class="eyebrow">One more thing</div><h2>Where should plans save?</h2></div><div class="db"><p>Pick the <b>Plans</b> folder inside <b>JNN Site Plan Builder</b> in OneDrive. You only do this once.</p></div><div class="df"><button class="btn" id="svLater">Later</button><button class="btn cta" id="svPick">${icon('folder')}Choose folder</button></div>`); $('#svLater').onclick = () => { closeModal(); setSaveState('Not saved to the folder yet — click to save', true); }; $('#svPick').onclick = async () => { closeModal(); if (await chooseFolder()) saveNow(true); }; } else saveNow(true); }
  else saveNow(false);
  clearInterval(S._hb); S._hb = setInterval(() => { if (S.P && !S.readOnly && S.file) { S.P.project.lock = { by: S.user, at: Date.now() }; saveNow(false, true); } }, 5 * 60 * 1000);
}
let REPL = null;
function replacePicture() {
  REPL = r => { const b = S.P.background; const keepPpf = b.pxPerFt * (r.w / (b.imgW || r.w)); Object.assign(b, { image: r.data, imgW: r.w, imgH: r.h, thumb: r.thumb, pxPerFt: f3(keepPpf || 5), calib: null }); REPL = null; closeModal(); renderBg(); fitView(); commit(); refreshAll(); startTool('calibrate'); toast('New picture in. Now set the scale: click two points.', false, 5000); };
  modal(`<div class="dh"><div class="eyebrow">Change the background</div><h2>New satellite picture</h2></div><div class="db"><div class="drop" id="drop2">${icon('img', 'style="width:54px;height:54px;color:#C92922"')}<div class="oswald" style="font-size:22px;text-transform:uppercase;font-weight:700">Drop the picture here</div><div class="note">or click to choose · or paste (Ctrl/Cmd+V)</div></div><p class="note">Everything you placed stays where it is in feet. You'll set the scale for the new picture next.</p></div><div class="df"><button class="btn" onclick="closeModal();REPL=null">Cancel</button></div>`);
  const d = $('#drop2'); d.onclick = () => { $('#fileImg').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadImgFile(f, REPL); }; $('#fileImg').click(); };
  d.ondragover = e => { e.preventDefault(); d.classList.add('over'); }; d.ondragleave = () => d.classList.remove('over'); d.ondrop = e => { e.preventDefault(); const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/')); if (f) loadImgFile(f, REPL); };
}

/* ---------------- duplicate a plan (start screen) ---------------- */
function startDuplicate() {
  needName(async () => {
    if (HAS_FS && !(S.dir && S.dirOk)) { if (!(await ensureFolder())) return; }
    if (!LIST.length) { toast('No plans to copy yet.', true); return; }
    modal(`<div class="dh"><div class="eyebrow">Duplicate a plan</div><h2>Which plan do you want to copy?</h2></div><div class="db"><div class="list-pick">${LIST.map((m, i) => `<button data-i="${i}"><img src="${m.thumb || ''}" alt=""><span class="grow"><b class="oswald" style="font-size:17px;text-transform:uppercase">${esc(m.name)}</b><br><span class="note">${esc([m.venue, fmtDate(m.date)].filter(Boolean).join(' · '))}</span></span></button>`).join('')}</div></div><div class="df"><button class="btn" onclick="closeModal()">Cancel</button></div>`);
    $$('[data-i]', $('#modal')).forEach(b => b.onclick = () => dupStep2(LIST[+b.dataset.i]));
  });
}
async function dupStep2(m) {
  let doc; try { if (m._local) doc = JSON.parse((await IDB.get('backup:' + m.id)).json); else doc = JSON.parse(await (await m._h.getFile()).text()); } catch (e) { toast("Couldn't read that plan.", true); return; }
  migrate(doc);
  const pj = { name: doc.project.name + ' (copy)', date: '' };
  modal(`<div class="dh"><div class="eyebrow">Copying ${esc(doc.project.name)}</div><h2>Name the new event</h2></div><div class="db" id="dupF">${fld('New event name', 'name')}${fld('Event date', 'date', 'date')}</div><div class="df"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn cta" id="dupOk">${icon('dup')}Make the copy</button></div>`);
  bindFields($('#dupF'), pj); $('[data-k="name"]').select();
  $('#dupOk').onclick = async () => {
    if (!pj.name.trim()) { toast('Give it a name.', true); return; }
    closeModal(); doc.project = Object.assign(doc.project, { id: uid('j'), name: pj.name.trim(), date: pj.date, status: 'Draft', createdAt: Date.now(), createdBy: S.user, lock: null });
    doc.plans.forEach(p => { p.history = []; p.lastSavedAt = null; });
    doc.meta = {}; loadDoc(doc, null, false); S.dirty = true; await saveNow(true); refreshList();
  };
}

/* ---------------- boot ---------------- */
function boot() {
  hydrateIcons();
  S.user = LS.get('spb.user', '') || ''; $('#whoName').textContent = S.user || 'Set your name';
  Object.assign(S.ui, LS.get('spb.ui', {}));
  $('#whoBtn').onclick = () => askName();
  $('#bNew').onclick = startNew; $('#bOpen').onclick = openPlanBtn; $('#bDup').onclick = startDuplicate;
  $('#fileOpen').onchange = fileInputOpen;
  ['search', 'sort', 'statusFilter'].forEach(id => $('#' + id).addEventListener('input', renderList));
  $('#homeBtn').onclick = goHome; $('#titleBtn').onclick = () => S.readOnly ? null : editDetails();
  $('#undoBtn').onclick = undo; $('#redoBtn').onclick = redo;
  $('#saveState').onclick = () => saveNow(true);
  $('#exportBtn').onclick = openExport; $('#pullBtn').onclick = showPull;
  $('#addBtn').onclick = () => $('#library').classList.toggle('open');
  document.addEventListener('paste', onPasteImage);
  buildLibrary(); bindStage(); bindExport();
  initFolder(); refreshList();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { buildLibrary(); if (S.P) renderScene(); });
}
/* ---------------- team password (online copy only) ----------------
   Keeps casual visitors out of the hosted page. It is NOT real security: the code is public.
   The OneDrive / double-clicked copy (file://) and local testing skip it.
   To change the password: put the SHA-256 of "jnn-spb:" + NEWPASSWORD (in capitals) in GATE_HASH. */
const GATE_HASH = 'cfc022d0584ee3c4818b0344f94086ceb3782610b6a40ddc8b0a53a14781ef6c';
function needsGate() { return /^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) && LS.get('spb.gate', '') !== GATE_HASH; }
async function sha256hex(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function showGate() {
  const g = document.createElement('div'); g.id = 'gate';
  g.innerHTML = `<div class="band" style="position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;z-index:200">
    <div class="eyebrow">Jim 'N Nick's Bar-B-Q · Catering</div><h1 style="margin:6px 0 22px">Site Plan Builder</h1>
    <label for="gatePw" style="font-size:16px;margin-bottom:8px">Type the team password</label>
    <input id="gatePw" type="password" autocomplete="current-password" style="height:52px;width:min(320px,100%);border-radius:12px;border:2px solid #C5C1B9;padding:0 16px;font-size:20px;text-align:center;background:#fff;color:#171512">
    <button class="btn cta" id="gateGo" style="margin-top:14px;min-width:200px;min-height:52px;font-size:18px">Open</button>
    <p id="gateMsg" style="min-height:22px;color:#ffb4a8;margin-top:12px"></p>
    <p class="note" style="color:#C5C1B9;max-width:420px">Ask your Local Owner for the password. You only type it once on each computer or iPad.</p></div>`;
  document.body.appendChild(g); const i = $('#gatePw'); i.focus();
  const go = async () => { const h = await sha256hex('jnn-spb:' + i.value.trim().toUpperCase()); if (h === GATE_HASH) { LS.set('spb.gate', h); g.remove(); boot(); } else { $('#gateMsg').textContent = "That's not it. Try again."; i.select(); } };
  $('#gateGo').onclick = go; i.onkeydown = e => { if (e.key === 'Enter') go(); };
}
document.addEventListener('DOMContentLoaded', () => { if (needsGate()) showGate(); else boot(); });

</script>
